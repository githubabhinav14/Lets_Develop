<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Team Project</title>
    
    <!-- Linking all CSS files Dont not change  -->
    <link rel="stylesheet" href="Styles.css">
    <link rel="stylesheet" href="Abhinav.css">
    <link rel="stylesheet" href="Fathima.css">
    <link rel="stylesheet" href="Ganesh.css">
    <link rel="stylesheet" href="Samreen.css">
</head>

<body>
   <nav style="display: flex; align-items: center; background-color: rgb(129, 18, 185); height: 65px;">

        <div style="margin-left: 10px;">
            <img src="./ZZZ.png" style="height: 50px;">
        </div>


        <div style="margin-left: 50px;">

            <h2 style="margin: 0px; font-size: 18px; color: white;">
                Delivery in minutes*
            </h2>

            <select id="location" name="location"
                    style="margin-top: 3px; width: 180px;">

                <option value="" selected disabled>
                    Select your location
                </option>

                <optgroup label="Andhra Pradesh">
                    <option value="vizianagaram">Vizianagaram</option>
                    <option value="visakhapatnam">Visakhapatnam</option>
                    <option value="srikakulam">Srikakulam</option>
                    <option value="vijayawada">Vijayawada</option>
                </optgroup>

                <optgroup label="Telangana">
                    <option value="hyderabad">Hyderabad</option>
                    <option value="warangal">Warangal</option>
                    <option value="karimnagar">Karimnagar</option>
                </optgroup>

                <optgroup label="Karnataka">
                    <option value="bangalore">Bangalore</option>
                    <option value="mysore">Mysore</option>
                </optgroup>

            </select>

        </div>
        <div style="margin-left: 5pc; display: flex;">

            <button style="height: 34px;">
                <i style="font-size: 24px;" class="fa">&#xf002;</i>
            </button>

            <input type="text"
                   placeholder="Search for Products..."
                   style="height: 30px; width: 40pc;">

        </div>
         <div style="margin-left: 7pc; text-align: center;">

            <i style="font-size: 24px;" class="fa">&#xf007;</i>

            <h6 style="margin: 1px; color: aliceblue;">Login</h6>

        </div>

        <div style="margin-left: 4pc; text-align: center;">

            <i style="font-size: 24px;" class="fa">&#xf07a;</i>

            <h6 style="margin: 1px; color: aliceblue;">Cart</h6>

        </div>

    </nav>

</body>
</html>
