
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="./Samreen.css">
</head>

<body>

    <div class="main-Container">

        <div class="left-Container">
            <img src="assests/icons/desktop-login-hero.png" alt="Zepto">
        </div>

        <div class="right-Container">

            <form action="">

                <h1>
                    Groceries delivered in
                    <span>minutes</span>
                </h1>

                <div class="phoneinput">

                    <a href="Country.html" target="myFrame" id="countryLink">
                        <img src="assests/flags/in.png" alt="India Flag">
                        <span>+91</span>
                        <span>▼</span>
                    </a>

                    <input type="tel"
                           placeholder="Enter Phone Number"
                           maxlength="10">

                </div>

                <iframe name="myFrame" id="countryFrame"></iframe>

                <button>Continue</button>

                <p>By Continuing, you agree to our</p>

                <p class="paratext">
                    Terms of Use & Privacy Policy
                </p>

            </form>

        </div>

    </div>

</body>
</html>
